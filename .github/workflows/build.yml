name: iPad build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: xcodebuild -version
      - name: Build for iPad Simulator
        run: |
          set -o pipefail
          xcodebuild -project HanXPad.xcodeproj -scheme HanXPad -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath dd \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES SWIFT_COMPILATION_MODE=wholemodule \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || true
          grep -E "error:" build.log | sort -u | head -400 || true
          tail -5 build.log
          grep -q "BUILD SUCCEEDED" build.log
      - name: Launch each editor in the iPad and iPhone Simulators
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPad (Pro|Air)" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "Simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          xcrun simctl install "$UDID" dd/Build/Products/Debug-iphonesimulator/HanX.app
          xcrun simctl ui "$UDID" appearance light || true
          status=0
          for kind in start document spreadsheet presentation pdf; do
            xcrun simctl launch "$UDID" com.hanword.editor.ipad -HanXDemo $kind
            sleep 14
            if ! xcrun simctl spawn "$UDID" launchctl list | grep -q com.hanword.editor.ipad; then
              echo "CRASH: $kind"; status=1
            fi
            xcrun simctl io "$UDID" screenshot "$kind.png" > /dev/null 2>&1 || true
            sips -Z 640 -s format jpeg -s formatOptions 30 "$kind.png" --out "$kind.jpg" > /dev/null
            echo "BEGIN-SHOT $kind"; base64 -i "$kind.jpg" | tr -d '\n'; echo; echo "END-SHOT $kind"
            xcrun simctl terminate "$UDID" com.hanword.editor.ipad || true
          done
          DATA=$(xcrun simctl get_app_container "$UDID" com.hanword.editor.ipad data)
          for kind in document spreadsheet presentation pdf; do echo "== export $kind"; cat "$DATA/Documents/export-$kind.txt" || echo missing; echo; done
          if grep -q "FAILED\|NOT PDF\|no editor" "$DATA"/Documents/export-*.txt; then status=1; fi
          # iPhone: same app, compact layout.
          PHONE=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9]( Pro)? \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "iPhone simulator $PHONE"
          xcrun simctl boot "$PHONE"
          xcrun simctl bootstatus "$PHONE" -b > /dev/null
          xcrun simctl install "$PHONE" dd/Build/Products/Debug-iphonesimulator/HanX.app
          for kind in start document spreadsheet presentation pdf; do
            xcrun simctl launch "$PHONE" com.hanword.editor.ipad -HanXDemo $kind
            sleep 14
            if ! xcrun simctl spawn "$PHONE" launchctl list | grep -q com.hanword.editor.ipad; then
              echo "CRASH: iphone-$kind"; status=1
            fi
            xcrun simctl io "$PHONE" screenshot "phone-$kind.png" > /dev/null 2>&1 || true
            sips -Z 520 -s format jpeg -s formatOptions 30 "phone-$kind.png" --out "phone-$kind.jpg" > /dev/null
            echo "BEGIN-SHOT phone-$kind"; base64 -i "phone-$kind.jpg" | tr -d '\n'; echo; echo "END-SHOT phone-$kind"
            xcrun simctl terminate "$PHONE" com.hanword.editor.ipad || true
          done
          for f in ~/Library/Logs/DiagnosticReports/HanX*; do [ -f "$f" ] && { echo "== $f"; head -80 "$f"; }; done
          exit $status
